[project]
name = "tipy"
version = "0.1.0"
description = "Model-oriented inverted-pendulum control experiments"
readme = "README.md"
authors = [
    { email = "ahmedismailahmed2004@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "jax>=0.11.1",
    "mujoco>=3.11.0",
    "mujoco-mjx[warp]>=3.11.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.uv]
package = false
